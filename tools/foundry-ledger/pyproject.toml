[project]
name = "foundry-ledger"
version = "0.1.0"
description = "SQLite bootstrap ledger for Foundry: migrations, YAML/JSONL import, verify, export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
foundry-ledger = "foundry_ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry_ledger"]

[tool.mypy]
strict = true
mypy_path = "stubs"
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
