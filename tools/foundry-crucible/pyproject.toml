[project]
name = "foundry-crucible"
version = "0.1.0"
description = "Plain command-line client for Foundry's Crucible orchestrator API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
foundry-crucible = "foundry_crucible.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry_crucible"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
